version: '3.8'

services:  
  momentum-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: momentum-signals-api
    image: cdempsey1221/momentum-signals-api:0.1.0
    restart: unless-stopped    
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - MYSQL_DSN=${MYSQL_DSN}
    networks:
      - azerothcore-wotlk_ac-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  azerothcore-wotlk_ac-network:
    external: true
